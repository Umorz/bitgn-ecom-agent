# Проверки при каждом push и pull request: тесты и поиск секретов.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.1"
      - name: Окружение агента строго по uv.lock
        working-directory: agent
        run: uv sync --locked
      - name: Тесты
        run: uv run --project agent pytest -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # вся история: gitleaks проверяет каждый коммит
      # Вся история при каждом запуске, а не диапазон "до и после push": после переписывания
      # истории прежней версии ветки нет, и проверка диапазона падает. Репозиторий маленький.
      - name: gitleaks по всей истории
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --config .gitleaks.toml --log-opts=--all --redact --no-banner --verbose
